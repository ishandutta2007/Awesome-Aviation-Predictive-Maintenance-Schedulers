<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1128" />
      <stop offset="50%" stop-color="#001e4d" />
      <stop offset="100%" stop-color="#000814" />
    </linearGradient>

    <!-- Glowing Accent Gradient -->
    <linearGradient id="cyan-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>

    <!-- Radar Sweep Gradient -->
    <linearGradient id="radar-sweep" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(0, 242, 254, 0.4)" />
      <stop offset="100%" stop-color="rgba(0, 242, 254, 0.0)" />
    </linearGradient>

    <!-- Pulse Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      .radar-sweep-arm {
        transform-origin: 1040px 170px;
        animation: rotateSweep 8s linear infinite;
      }
      @keyframes rotateSweep {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      .flight-path {
        stroke-dasharray: 8 6;
        animation: dashMove 20s linear infinite;
      }
      @keyframes dashMove {
        to { stroke-dashoffset: -200; }
      }
      .telemetry-pulse {
        animation: pulseGlow 2.5s ease-in-out infinite alternate;
      }
      @keyframes pulseGlow {
        0% { opacity: 0.3; transform: scale(0.98); }
        100% { opacity: 0.85; transform: scale(1.02); }
      }
      .signal-dot {
        animation: blink 1.6s ease-in-out infinite alternate;
      }
      @keyframes blink {
        0% { opacity: 0.2; r: 3; }
        100% { opacity: 1; r: 6; }
      }
      .wave-bar {
        animation: waveAnim 2s ease-in-out infinite alternate;
      }
      @keyframes waveAnim {
        0% { transform: scaleY(0.4); }
        100% { transform: scaleY(1.1); }
      }
      .title-text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        font-weight: 800;
        font-size: 38px;
        letter-spacing: -0.5px;
        fill: #ffffff;
      }
      .subtitle-text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        font-weight: 400;
        font-size: 16px;
        letter-spacing: 0.2px;
        fill: #93c5fd;
      }
      .badge-text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        font-weight: 600;
        font-size: 12px;
        letter-spacing: 1px;
        fill: #38bdf8;
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="100%" height="100%" rx="16" fill="url(#bg-grad)" stroke="#1e3a8a" stroke-width="1.5" />

  <!-- Animated Flight / Telemetry Paths (Background layer) -->
  <g opacity="0.35">
    <path class="flight-path" d="M -50 260 Q 300 80 650 200 T 1250 100" fill="none" stroke="#00f2fe" stroke-width="2" />
    <path class="flight-path" d="M -20 290 Q 350 220 700 310 T 1250 220" fill="none" stroke="#3b82f6" stroke-width="1.5" />
    <path class="flight-path" d="M 100 -20 Q 500 180 850 50 T 1250 320" fill="none" stroke="#60a5fa" stroke-width="1" />
  </g>

  <!-- Dynamic Radar Circle & Sweep (Right Background) -->
  <g opacity="0.45">
    <circle cx="1040" cy="170" r="120" fill="none" stroke="#1e40af" stroke-width="1.5" />
    <circle cx="1040" cy="170" r="80" fill="none" stroke="#1d4ed8" stroke-width="1.2" stroke-dasharray="4 4" />
    <circle cx="1040" cy="170" r="40" fill="none" stroke="#2563eb" stroke-width="1" />
    <line x1="920" y1="170" x2="1160" y2="170" stroke="#1e40af" stroke-width="1" />
    <line x1="1040" y1="50" x2="1040" y2="290" stroke="#1e40af" stroke-width="1" />
    
    <!-- Rotating Sweep Arm -->
    <path class="radar-sweep-arm" d="M 1040 170 L 1160 170 A 120 120 0 0 0 1040 50 Z" fill="url(#radar-sweep)" />
    
    <!-- Radar blips -->
    <circle class="signal-dot" cx="1090" cy="130" r="4" fill="#00f2fe" filter="url(#glow)" />
    <circle class="signal-dot" cx="990" cy="210" r="4" fill="#38bdf8" filter="url(#glow)" style="animation-delay: 0.8s;" />
    <circle class="signal-dot" cx="1070" cy="225" r="3" fill="#60a5fa" filter="url(#glow)" style="animation-delay: 1.2s;" />
  </g>

  <!-- Real-time Frequency / Telemetry Waves (Dynamic elements at bottom) -->
  <g transform="translate(680, 270)" opacity="0.5">
    <line x1="0" y1="0" x2="260" y2="0" stroke="#1e3a8a" stroke-width="1" />
    <rect class="wave-bar" x="10" y="-18" width="4" height="18" fill="#00f2fe" style="transform-origin: 10px 0; animation-delay: 0.1s;" />
    <rect class="wave-bar" x="22" y="-28" width="4" height="28" fill="#38bdf8" style="transform-origin: 22px 0; animation-delay: 0.4s;" />
    <rect class="wave-bar" x="34" y="-12" width="4" height="12" fill="#60a5fa" style="transform-origin: 34px 0; animation-delay: 0.2s;" />
    <rect class="wave-bar" x="46" y="-35" width="4" height="35" fill="#00f2fe" style="transform-origin: 46px 0; animation-delay: 0.7s;" />
    <rect class="wave-bar" x="58" y="-22" width="4" height="22" fill="#38bdf8" style="transform-origin: 58px 0; animation-delay: 0.3s;" />
    <rect class="wave-bar" x="70" y="-15" width="4" height="15" fill="#60a5fa" style="transform-origin: 70px 0; animation-delay: 0.5s;" />
    <rect class="wave-bar" x="82" y="-30" width="4" height="30" fill="#00f2fe" style="transform-origin: 82px 0; animation-delay: 0.8s;" />
    <rect class="wave-bar" x="94" y="-24" width="4" height="24" fill="#38bdf8" style="transform-origin: 94px 0; animation-delay: 0.15s;" />
    <rect class="wave-bar" x="106" y="-40" width="4" height="40" fill="#00f2fe" style="transform-origin: 106px 0; animation-delay: 0.6s;" />
    <rect class="wave-bar" x="118" y="-18" width="4" height="18" fill="#60a5fa" style="transform-origin: 118px 0; animation-delay: 0.35s;" />
    <rect class="wave-bar" x="130" y="-26" width="4" height="26" fill="#38bdf8" style="transform-origin: 130px 0; animation-delay: 0.9s;" />
    <rect class="wave-bar" x="142" y="-32" width="4" height="32" fill="#00f2fe" style="transform-origin: 142px 0; animation-delay: 0.45s;" />
    <rect class="wave-bar" x="154" y="-14" width="4" height="14" fill="#60a5fa" style="transform-origin: 154px 0; animation-delay: 0.25s;" />
    <rect class="wave-bar" x="166" y="-28" width="4" height="28" fill="#38bdf8" style="transform-origin: 166px 0; animation-delay: 0.75s;" />
    <rect class="wave-bar" x="178" y="-20" width="4" height="20" fill="#00f2fe" style="transform-origin: 178px 0; animation-delay: 0.1s;" />
    <text x="195" y="-10" font-family="monospace" font-size="10" fill="#38bdf8" opacity="0.8">RUL SENSOR VIB: 0.94</text>
  </g>

  <!-- FOREGROUND CONTENT: Header Category Tag -->
  <g transform="translate(60, 52)">
    <rect width="320" height="28" rx="14" fill="#0369a1" fill-opacity="0.25" stroke="#0284c7" stroke-width="1" />
    <circle cx="16" cy="14" r="5" fill="#00f2fe" />
    <text x="30" y="19" class="badge-text">FLEET HEALTH • RUL PREDICTION • MRO</text>
  </g>

  <!-- FOREGROUND CONTENT: Main Title (Always clear and visible) -->
  <g transform="translate(60, 130)">
    <!-- Subtle drop shadow backing for guaranteed contrast -->
    <text x="0" y="0" class="title-text" fill="#000000" opacity="0.6" dx="2" dy="2">Aviation Predictive Maintenance Schedulers</text>
    <text x="0" y="0" class="title-text">Aviation Predictive Maintenance Schedulers</text>
  </g>

  <!-- FOREGROUND CONTENT: Subtitle & Description -->
  <g transform="translate(60, 172)">
    <text x="0" y="0" class="subtitle-text">Curated SaaS Platforms, Enterprise MRO Suites &amp; Open-Source ML Pipelines</text>
    <text x="0" y="26" class="subtitle-text" fill="#cbd5e1" font-size="14">Turning full-flight sensor telemetry &amp; digital twins into optimal aircraft dispatch reliability.</text>
  </g>

  <!-- FOREGROUND CONTENT: Stat Badges/Pills in foreground -->
  <g transform="translate(60, 246)">
    <!-- Pill 1: SaaS Leaders -->
    <rect width="180" height="38" rx="8" fill="#0f172a" fill-opacity="0.8" stroke="#1e40af" stroke-width="1.2" />
    <text x="16" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="13" font-weight="600" fill="#38bdf8">✈️ 10+ Enterprise Suites</text>

    <!-- Pill 2: Open Source -->
    <rect x="195" y="0" width="180" height="38" rx="8" fill="#0f172a" fill-opacity="0.8" stroke="#1e40af" stroke-width="1.2" />
    <text x="211" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="13" font-weight="600" fill="#34d399">⚡ 24+ Open-Source Repos</text>

    <!-- Pill 3: NASA Datasets -->
    <rect x="390" y="0" width="180" height="38" rx="8" fill="#0f172a" fill-opacity="0.8" stroke="#1e40af" stroke-width="1.2" />
    <text x="406" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="13" font-weight="600" fill="#f59e0b">📊 C-MAPSS &amp; Digital Twins</text>
  </g>

  <!-- Jet Aircraft Icon Silhouette (Top right foreground) -->
  <g transform="translate(990, 80) rotate(-22)" opacity="0.85">
    <path d="M 0 0 L 25 -10 L 40 -10 L 25 0 L 60 2 L 75 -2 L 80 0 L 60 6 L 15 8 L 5 18 L -5 18 L 0 8 L -20 7 L -28 12 L -34 12 L -30 6 L -35 5 L -35 4 L -30 3 L -34 -2 L -28 -2 L -20 2 Z" fill="url(#cyan-glow)" filter="url(#glow)" />
  </g>
</svg>
